<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#071726"/>
    </linearGradient>
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Radar / Acoustic Waves (Leak Detection Symbolism) -->
  <circle cx="256" cy="270" r="180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.25"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="256" cy="270" r="100" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.6"/>

  <!-- Water Droplet with Acoustic Sensor Core -->
  <path d="M 256,90 C 256,90 140,240 140,320 C 140,384 192,436 256,436 C 320,436 372,384 372,320 C 372,240 256,90 256,90 Z" 
        fill="url(#drop-grad)" filter="url(#glow)"/>

  <!-- Droplet Gloss Highlight -->
  <path d="M 210,210 C 200,230 190,270 190,310 C 190,325 195,340 200,345 C 205,350 215,345 220,335 C 225,320 225,260 250,210 C 255,200 240,180 230,185 C 220,190 215,200 210,210 Z" 
        fill="#ffffff" opacity="0.4"/>

  <!-- Hydro Control Pulse Wave inside Droplet -->
  <path d="M 180,330 L 220,330 L 235,280 L 256,365 L 275,305 L 290,330 L 332,330" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
